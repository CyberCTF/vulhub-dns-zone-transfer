name: Test lab

# Proves the lab still builds, starts and behaves as its checks say: on every push to main, every
# week (upstream images and package mirrors change under a lab), and on demand. Docker labs run
# their checks for real; labs that need VMs are validated only (GitHub's runners can't run them).
# Free on public repositories (standard runners).
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".ctf/**", ".github/workflows/publish.yml"]
  schedule:
    - cron: "21 2 * * 2"
  workflow_dispatch:

concurrency:
  group: test-lab
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: isoloom/isoloom@v0.9.0
      - run: isoloom validate
      - name: Generated files are current
        run: isoloom check
      - name: Can it run on Docker here?
        id: docker
        run: |
          isoloom targets > "$RUNNER_TEMP/targets"
          if grep -qx '✓ docker' "$RUNNER_TEMP/targets"; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Docker target: this lab needs VMs, so it is validated only."
          fi
      - if: steps.docker.outputs.on == 'true'
        name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h / | tail -1
      - if: steps.docker.outputs.on == 'true'
        name: Start
        run: isoloom run docker
      - if: steps.docker.outputs.on == 'true'
        name: Checks
        run: isoloom test docker
      - if: failure() && steps.docker.outputs.on == 'true'
        name: Container state and logs
        run: |
          docker ps -a --format '{{.Names}}\t{{.Status}}'
          for c in $(docker ps -aq); do echo "=== $(docker inspect -f '{{.Name}}' "$c")"; docker logs --tail 80 "$c" 2>&1; done
      - if: always() && steps.docker.outputs.on == 'true'
        name: Stop
        run: isoloom down docker || true
