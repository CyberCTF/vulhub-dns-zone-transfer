# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# DNS zone transfer (Vulhub, by phith0n and the Vulhub contributors) as an Isoloom spec:
# Vulhub's dns/dns-zone-transfer, vendored in build/dns/app/: the published image
# vulhub/bind:9.10.3 with Vulhub's zone files copied in (build/dns/).
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: vulhub-dns-zone-transfer

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.61.32.0/24, internet: false}

machines:
  dns:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 128}
    volumes: {ctf: /ctf}     # the zone file part holding the flag, written by ctf/flag.sh at every start
    ports:
      dns:
        port: 53
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/dns

checks:
  - name: the DNS server answers over TCP
    tcp: dns:53
    wait: 60
  - name: the server is authoritative for vulhub.org
    script: checks/dns.sh
    wait: 30

message: |
  A DNS server answers on 127.0.0.1:{{ machines.dns.ports.dns.published }} (TCP; UDP inside the lab network) for the zone vulhub.org.
  What does it give to anyone who asks for the whole zone?
